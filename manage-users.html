<!DOCTYPE html>
<html>
<head>
<title>Manage Users</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef4ff;color:#172554}
.app{max-width:420px;margin:auto;background:white;min-height:100vh;padding:20px}
.header{background:#2563eb;color:white;padding:18px;border-radius:18px}
.header h2{margin:0 0 5px}
.header p{margin:3px 0;font-size:14px;opacity:0.9}
.card{margin-top:15px;padding:15px;border-radius:15px;box-shadow:0 3px 12px #ddd}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:10px;font-size:14px}
.user-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;font-size:14px}
.user-row:last-child{border-bottom:none}
.user-info b{display:block;font-size:14px}
.user-info span{font-size:12px;color:#64748b}
.btn-delete{background:#fee2e2;color:red;border:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold}
.btn-delete:hover{background:#fecaca}
button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:bold;cursor:pointer;font-size:15px}
.btn-outline{background:white;color:#2563eb;border:2px solid #2563eb}
.success{color:green;font-size:13px;margin-top:8px;display:none;background:#dcfce7;padding:10px;border-radius:8px}
.error{color:red;font-size:13px;margin-top:8px;display:none;background:#fee2e2;padding:10px;border-radius:8px}
.skeleton{background:#e2e8f0;border-radius:8px;height:50px;margin:8px 0;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.empty{text-align:center;color:#64748b;font-size:14px;padding:15px 0}
.tabs{display:flex;gap:8px;margin-top:15px}
.tab{flex:1;padding:10px;border-radius:10px;border:2px solid #2563eb;background:white;color:#2563eb;font-weight:bold;cursor:pointer;font-size:14px}
.tab.active{background:#2563eb;color:white}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h2 id="pageTitle">Manage Users</h2>
    <p>Admin Panel</p>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tabStudent" onclick="switchTab('student')">👨🎓 Students</button>
    <button class="tab" id="tabTeacher" onclick="switchTab('teacher')">👨🏫 Teachers</button>
  </div>

  <!-- Add User Form -->
  <div class="card">
    <h3 style="margin-top:0" id="formTitle">Add Student</h3>
    <input type="text"     id="userName"     placeholder="Full Name">
    <input type="text"     id="userPRN"      placeholder="PRN / Employee ID">
    <input type="email"    id="userEmail"    placeholder="Email">
    <input type="password" id="userPassword" placeholder="Password">
    <div id="subjectWrap" style="display:none">
      <select id="userSubject">
        <option value="">Assign Subject (optional)</option>
      </select>
    </div>
    <button onclick="addUser()">➕ Add User</button>
    <div class="success" id="successMsg"></div>
    <div class="error"   id="errorMsg"></div>
  </div>

  <!-- User List -->
  <div class="card">
    <h3 style="margin-top:0" id="listTitle">Student List</h3>
    <div id="userList">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </div>

  <button class="btn-outline" onclick="location.href='admin-dashboard.html'">← Back to Dashboard</button>

</div>

<script type="module">
import { supabase, requireRole } from './supabase.js'

let currentRole = 'student'
let profile     = null

async function init() {
  profile = await requireRole('admin')
  if (!profile) return

  // Check URL param for initial tab
  const params = new URLSearchParams(location.search)
  const role   = params.get('role')
  if (role === 'teacher') switchTab('teacher')
  else switchTab('student')

  loadSubjects()
}

window.switchTab = function(role) {
  currentRole = role
  document.getElementById('tabStudent').className = role === 'student' ? 'tab active' : 'tab'
  document.getElementById('tabTeacher').className = role === 'teacher' ? 'tab active' : 'tab'
  document.getElementById('formTitle').textContent = role === 'student' ? 'Add Student' : 'Add Teacher'
  document.getElementById('listTitle').textContent = role === 'student' ? 'Student List' : 'Teacher List'
  document.getElementById('subjectWrap').style.display = role === 'teacher' ? 'block' : 'none'
  loadUsers(role)
}

async function loadSubjects() {
  const { data } = await supabase.from('subjects').select('id, name')
  const select   = document.getElementById('userSubject')
  if (data) {
    data.forEach(s => {
      const opt = document.createElement('option')
      opt.value = s.id
      opt.textContent = s.name
      select.appendChild(opt)
    })
  }
}

async function loadUsers(role) {
  document.getElementById('userList').innerHTML =
    '<div class="skeleton"></div><div class="skeleton"></div>'

  const { data, error } = await supabase
    .from('users')
    .select('id, name, prn, email')
    .eq('role', role)
    .order('name')

  const list = document.getElementById('userList')

  if (error || !data || data.length === 0) {
    list.innerHTML = `<p class="empty">No ${role}s found.</p>`
    return
  }

  list.innerHTML = data.map(u => `
    <div class="user-row">
      <div class="user-info">
        <b>${u.name}</b>
        <span>${u.prn || u.email}</span>
      </div>
      <button class="btn-delete" onclick="deleteUser('${u.id}', '${role}')">Delete</button>
    </div>
  `).join('')
}

window.addUser = async function() {
  const name     = document.getElementById('userName').value.trim()
  const prn      = document.getElementById('userPRN').value.trim()
  const email    = document.getElementById('userEmail').value.trim()
  const password = document.getElementById('userPassword').value
  const subject  = document.getElementById('userSubject').value
  const successMsg = document.getElementById('successMsg')
  const errorMsg   = document.getElementById('errorMsg')

  successMsg.style.display = 'none'
  errorMsg.style.display   = 'none'

  if (!name || !email || !password) {
    errorMsg.textContent   = 'Name, email and password are required.'
    errorMsg.style.display = 'block'
    return
  }

  // Create auth user via Supabase Admin (uses service role — needs backend)
  // Since we're frontend only, we use signUp then insert profile
  const { data: authData, error: authError } = await supabase.auth.signUp({ email, password })

  if (authError) {
    errorMsg.textContent   = 'Auth error: ' + authError.message
    errorMsg.style.display = 'block'
    return
  }

  const userId = authData.user?.id
  if (!userId) {
    errorMsg.textContent   = 'Failed to create auth user.'
    errorMsg.style.display = 'block'
    return
  }

  // Insert into users table
  const { error: insertError } = await supabase
    .from('users')
    .insert({ id: userId, name, prn, email, role: currentRole })

  if (insertError) {
    errorMsg.textContent   = 'Profile error: ' + insertError.message
    errorMsg.style.display = 'block'
    return
  }

  // If teacher and subject selected, assign subject
  if (currentRole === 'teacher' && subject) {
    await supabase.from('subjects').update({ teacher_id: userId }).eq('id', subject)
  }

  // Clear form
  document.getElementById('userName').value     = ''
  document.getElementById('userPRN').value      = ''
  document.getElementById('userEmail').value    = ''
  document.getElementById('userPassword').value = ''
  document.getElementById('userSubject').value  = ''

  successMsg.textContent   = `${currentRole === 'student' ? 'Student' : 'Teacher'} added successfully!`
  successMsg.style.display = 'block'

  loadUsers(currentRole)
}

window.deleteUser = async function(userId, role) {
  if (!confirm('Are you sure you want to delete this user?')) return

  const { error } = await supabase.from('users').delete().eq('id', userId)

  if (error) {
    alert('Failed to delete: ' + error.message)
    return
  }

  loadUsers(role)
}

init()
</script>
</body>
</html>
