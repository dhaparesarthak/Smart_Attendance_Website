<!DOCTYPE html>
<html>
<head>
<title>Attendance Report</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef4ff;color:#172554}
.app{max-width:420px;margin:auto;background:white;min-height:100vh;padding:20px}
.header{background:#2563eb;color:white;padding:18px;border-radius:18px}
.header h2{margin:0 0 5px}
.header p{margin:3px 0;font-size:14px;opacity:0.9}
.filters{display:flex;gap:8px;margin-top:15px}
.filters select{flex:1;padding:10px;border:1px solid #ccc;border-radius:10px;font-size:13px}
.card{margin-top:15px;padding:15px;border-radius:15px;box-shadow:0 3px 12px #ddd}
.summary{display:flex;justify-content:space-around;text-align:center;padding:10px 0}
.summary-item span{font-size:12px;color:#64748b}
.summary-item b{display:block;font-size:20px;color:#2563eb}
.lecture-block{margin-bottom:15px;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}
.lecture-header{background:#eff6ff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.lecture-header b{font-size:14px}
.lecture-header span{font-size:12px;color:#64748b}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.badge-green{background:#dcfce7;color:green}
.badge-red{background:#fee2e2;color:red}
.student-row{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;border-top:1px solid #eee;font-size:13px}
.present{color:green;font-weight:bold}
.absent{color:red;font-weight:bold}
button{width:100%;padding:13px;margin-top:15px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:bold;cursor:pointer;font-size:15px}
.btn-outline{background:white;color:#2563eb;border:2px solid #2563eb}
.skeleton{background:#e2e8f0;border-radius:8px;height:80px;margin:8px 0;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.empty{text-align:center;color:#64748b;font-size:14px;padding:20px 0}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h2>📊 Attendance Report</h2>
    <p id="teacherName">Loading...</p>
  </div>

  <!-- Filters -->
  <div class="filters">
    <select id="subjectFilter" onchange="applyFilter()">
      <option value="">All Subjects</option>
    </select>
    <select id="dateFilter" onchange="applyFilter()">
      <option value="">All Dates</option>
    </select>
  </div>

  <!-- Summary -->
  <div class="card">
    <div class="summary">
      <div class="summary-item"><b id="totalLectures">-</b><span>Lectures</span></div>
      <div class="summary-item"><b id="totalPresent" style="color:green">-</b><span>Present</span></div>
      <div class="summary-item"><b id="totalAbsent" style="color:red">-</b><span>Absent</span></div>
      <div class="summary-item"><b id="avgPercent">-</b><span>Avg %</span></div>
    </div>
  </div>

  <!-- Lecture-wise Report -->
  <div id="reportList">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <button class="btn-outline" onclick="location.href='teacher-dashboard.html'">← Back to Dashboard</button>

</div>

<script type="module">
import { supabase, requireRole } from './supabase.js'

let allLectures = []

async function loadReport() {
  const profile = await requireRole('teacher')
  if (!profile) return

  document.getElementById('teacherName').textContent = profile.name

  // Fetch all lectures by this teacher with attendance
  const { data: lectures, error } = await supabase
    .from('lectures')
    .select(`
      id,
      date,
      subjects ( name ),
      attendance (
        status,
        users ( name, prn )
      )
    `)
    .eq('teacher_id', profile.id)
    .order('date', { ascending: false })

  if (error || !lectures) {
    document.getElementById('reportList').innerHTML = '<p class="empty">Failed to load report.</p>'
    return
  }

  allLectures = lectures

  // Populate subject filter
  const subjects = [...new Set(lectures.map(l => l.subjects?.name).filter(Boolean))]
  const subjectFilter = document.getElementById('subjectFilter')
  subjects.forEach(s => {
    const opt = document.createElement('option')
    opt.value = s
    opt.textContent = s
    subjectFilter.appendChild(opt)
  })

  // Populate date filter
  const dates = [...new Set(lectures.map(l => l.date).filter(Boolean))]
  const dateFilter = document.getElementById('dateFilter')
  dates.forEach(d => {
    const opt = document.createElement('option')
    opt.value = d
    opt.textContent = new Date(d).toLocaleDateString('en-IN', {
      day: 'numeric', month: 'short', year: 'numeric'
    })
    dateFilter.appendChild(opt)
  })

  renderReport(lectures)
}

window.applyFilter = function() {
  const subject = document.getElementById('subjectFilter').value
  const date    = document.getElementById('dateFilter').value

  const filtered = allLectures.filter(l => {
    const matchSubject = !subject || l.subjects?.name === subject
    const matchDate    = !date    || l.date === date
    return matchSubject && matchDate
  })

  renderReport(filtered)
}

function renderReport(lectures) {
  let totalPresent = 0
  let totalAbsent  = 0

  const reportList = document.getElementById('reportList')

  if (lectures.length === 0) {
    reportList.innerHTML = '<p class="empty">No lectures found.</p>'
    updateSummary(0, 0, 0, 0)
    return
  }

  reportList.innerHTML = lectures.map(lecture => {
    const attendance = lecture.attendance || []
    const present    = attendance.filter(a => a.status === 'present').length
    const absent     = attendance.filter(a => a.status === 'absent').length
    const total      = attendance.length
    const percent    = total > 0 ? Math.round((present / total) * 100) : 0

    totalPresent += present
    totalAbsent  += absent

    const date = new Date(lecture.date).toLocaleDateString('en-IN', {
      day: 'numeric', month: 'short', year: 'numeric'
    })

    const studentRows = attendance.length === 0
      ? '<div class="student-row"><span style="color:#64748b">No students scanned yet.</span></div>'
      : attendance.map(a => `
          <div class="student-row">
            <span><b>${a.users?.name || 'Unknown'}</b><br>
            <span style="color:#64748b;font-size:12px">${a.users?.prn || ''}</span></span>
            <span class="${a.status === 'present' ? 'present' : 'absent'}">
              ${a.status === 'present' ? '✓ Present' : '✕ Absent'}
            </span>
          </div>`
        ).join('')

    return `
      <div class="lecture-block">
        <div class="lecture-header">
          <div>
            <b>${lecture.subjects?.name || 'Unknown'}</b><br>
            <span>${date}</span>
          </div>
          <span class="badge ${percent >= 75 ? 'badge-green' : 'badge-red'}">${percent}% (${present}/${total})</span>
        </div>
        ${studentRows}
      </div>`
  }).join('')

  const totalScans = totalPresent + totalAbsent
  const avg = totalScans > 0 ? Math.round((totalPresent / totalScans) * 100) : 0
  updateSummary(lectures.length, totalPresent, totalAbsent, avg)
}

function updateSummary(lectures, present, absent, avg) {
  document.getElementById('totalLectures').textContent = lectures
  document.getElementById('totalPresent').textContent  = present
  document.getElementById('totalAbsent').textContent   = absent
  document.getElementById('avgPercent').textContent    = avg + '%'
}

loadReport()
</script>
</body>
</html>
